[workspace]
members = [
    ".",
    "crates/rshtml-sourcemap",
    "crates/rshtml-ra-proxy",
    "crates/rshtml-signature",
    "crates/rshtml-transpiler",
    "crates/rshtml-vfs",
]

[package]
name = "rshtml-analyzer"
version = "0.1.7"
edition = "2024"

[dependencies]
tower-lsp = { version = "0.20.0" }
tokio = { version = "1.45.1", features = ["full"] }
tree-sitter = "0.25.6"
tree-sitter-highlight = "0.25.6"
# tree-sitter-rshtml = { path = "../tree-sitter-rshtml" }
tree-sitter-rshtml = { git = "https://github.com/rshtml/tree-sitter-rshtml.git", tag = "v0.1.6" }
tree-sitter-html = "0.23.2"
tree-sitter-rust = "0.24.0"
tracing = { version = "0.1.41", features = ["release_max_level_info"] }
tracing-subscriber = "0.3.19"
toml = "0.9.2"
clap = { version = "4.5.45", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.111", features = ["full"] }
quote = "1.0.40"
rshtml_core = { version = "0.6.1", path = "../rshtml/rshtml_core" }


rshtml-sourcemap = { path = "crates/rshtml-sourcemap" }
rshtml-ra-proxy = { path = "crates/rshtml-ra-proxy" }
rshtml-signature = { path = "crates/rshtml-signature" }
rshtml-transpiler = { path = "crates/rshtml-transpiler" }
rshtml-vfs = { path = "crates/rshtml-vfs" }
