[package]
name = "rshtml-signature"
version = "0.1.0"
edition = "2024"
description = "Rust AST scanner and struct signature resolver for rshtml templates"

[dependencies]
syn = { version = "2.0.111", features = ["full"] }
quote = "1.0.40"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
